version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waiter_app
    ports:
      - "5050:5050"
    volumes:
      - waiter_data:/app/data
    environment:
      - PORT=5050
      - SECRET_KEY=waiter-uk-enterprise-secret-key-2026
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    container_name: waiter_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  waiter_data:
